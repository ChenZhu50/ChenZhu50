<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="这个好喜剧">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121c33"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#35d0a5"/></linearGradient>
</defs>
<style>
  .t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:#e6edf3}
  .d{font:400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:#8b98ad}
  .m{font:800 44px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:url(#acc)}
  .ms{font:500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:#8b98ad}
  .chip{font:500 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:#b8c4d8}
  .dot{fill:#35d0a5}
  .pill{fill:#16213a;stroke:#243150}
  .lv{font:600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:#35d0a5}
  .ping{fill:none;stroke:#35d0a5;stroke-width:2;animation:ping 2s ease-out infinite}
  .shine{animation:shine 6s ease-in-out infinite}
  @keyframes ping{0%{r:4;opacity:.9}100%{r:10;opacity:0}}
  @keyframes shine{0%,70%{transform:translateX(-200px)}100%{transform:translateX(800px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<clipPath id="clip"><rect width="600" height="200" rx="14"/></clipPath>
<g clip-path="url(#clip)">
  <rect width="600" height="200" fill="url(#bg)"/>
  <rect width="600" height="4" fill="url(#acc)"/>
  <rect x="0" y="0" width="120" height="200" fill="#4f8cff" opacity="0.05" transform="skewX(-20)" class="shine"/>
</g>
<rect x="0.5" y="0.5" width="599" height="199" rx="14" fill="none" stroke="#243150"/>
<text x="28" y="52" class="t">这个好喜剧</text><rect x="508" y="22" width="64" height="24" rx="12" class="pill"/><circle cx="524" cy="34" r="4" class="dot"/><circle cx="524" cy="34" r="4" class="ping"/><text x="534" y="38.5" class="lv">live</text>
<text x="28" y="90" class="d">洛杉矶喜剧团体的双语网站</text>
<text x="28" y="114" class="d">与搜索可见度优化。</text>
<text x="572" y="104" text-anchor="end" class="m">#2</text>
<text x="572" y="126" text-anchor="end" class="ms">Google 自然搜索</text>
<rect x="28" y="150" width="65" height="26" rx="13" fill="#16213a" stroke="#243150"/><text x="60.5" y="167.5" text-anchor="middle" class="chip">Astro</text><rect x="101" y="150" width="81.39999999999999" height="26" rx="13" fill="#16213a" stroke="#243150"/><text x="141.7" y="167.5" text-anchor="middle" class="chip">JSON-LD</text><rect x="190.39999999999998" y="150" width="89.6" height="26" rx="13" fill="#16213a" stroke="#243150"/><text x="235.2" y="167.5" text-anchor="middle" class="chip">hreflang</text>
</svg>
