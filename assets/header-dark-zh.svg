style="animation-delay:1.35s"/><circle cx="920" cy="190" r="5" class="node"/><circle cx="1050" cy="210" r="11" class="halo" style="animation-delay:1.80s"/><circle cx="1050" cy="210" r="5" class="node alt"/><circle cx="1140" cy="250" r="11" class="halo" style="animation-delay:2.25s"/><circle cx="1140" cy="250" r="5" class="node"/><circle cx="820" cy="250" r="11" class="halo" style="animation-delay:2.70s"/><circle cx="820" cy="250" r="5" class="node"/><circle cx="980" cy="280" r="11" class="halo" style="animation-delay:3.15s"/><circle cx="980" cy="280" r="5" class="node alt"/></g>
<g class="fadein"><text x="60" y="112" class="name">朱琛</text><text x="214" y="112" class="cn">Chen Zhu</text><text x="62" y="156" class="tag">软件工程师 · 后端 · 全栈 · 应用 AI</text></g>
<rect x="62" y="176" width="140" height="4" rx="2" fill="url(#acc)" class="bar" style="transform-origin:62px 178px"/>
<rect x="48" y="220" width="700" height="62" rx="12" fill="#0e1628" stroke="#243150"/>
<text x="66" y="262" class="prompt">›</text>
<g class="l0"><text x="88" y="262" class="big">Google</text><text x="184" y="262" class="small">软件工程实习生 · AI 与机器人</text></g><g class="l1"><text x="88" y="262" class="big">USC</text><text x="145" y="262" class="small">计算机科学硕士 · 2027</text></g><g class="l2"><text x="88" y="262" class="big">32s → 9s</text><text x="210" y="262" class="small">蒙特卡洛批量模拟迁入 worker pool</text></g><g class="l3"><text x="88" y="262" class="big">300+</text><text x="158" y="262" class="small">名学生在课上用我的 BERT 可视化工具</text></g>
