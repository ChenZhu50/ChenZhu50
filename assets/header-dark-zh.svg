<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="朱琛 · 软件工程师 · 后端、全栈、应用 AI">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#35d0a5"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.5" r="0.5"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.18"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1f2a44"/></pattern>
<clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<style>
.name{font:700 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:#e6edf3;letter-spacing:-1px}
.cn{font:500 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:#8b98ad}
.tag{font:500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;fill:#8b98ad}
.big{font:700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:url(#acc)}
.small{font:400 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:#e6edf3}
.prompt{font:600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;fill:#35d0a5}
.edge{stroke:#2a3a5c;stroke-width:1.5}
.flow{stroke:url(#acc);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:14 200;animation:flow 2.4s linear infinite}
.node{fill:#4f8cff} .node.alt{fill:#35d0a5}
.halo{fill:#4f8cff;opacity:0;animation:pulse 3.6s ease-out infinite}
.bar{animation:grow 1.2s ease-out both}
.fadein{animation:fade 1s ease-out both}
@keyframes flow{from{stroke-dashoffset:214}to{stroke-dashoffset:0}}
@keyframes pulse{0%{opacity:.35;r:5}70%{opacity:0;r:18}100%{opacity:0;r:18}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes l0{0%{opacity:0;transform:translateY(8px)}0.00%{opacity:0;transform:translateY(8px)}3.00%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0)}25.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}.l0{opacity:0;animation:l0 12.8s linear infinite}@keyframes l1{0%{opacity:0;transform:translateY(8px)}25.00%{opacity:0;transform:translateY(8px)}28.00%{opacity:1;transform:translateY(0)}47.00%{opacity:1;transform:translateY(0)}50.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}.l1{opacity:0;animation:l1 12.8s linear infinite}@keyframes l2{0%{opacity:0;transform:translateY(8px)}50.00%{opacity:0;transform:translateY(8px)}53.00%{opacity:1;transform:translateY(0)}72.00%{opacity:1;transform:translateY(0)}75.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}.l2{opacity:0;animation:l2 12.8s linear infinite}@keyframes l3{0%{opacity:0;transform:translateY(8px)}75.00%{opacity:0;transform:translateY(8px)}78.00%{opacity:1;transform:translateY(0)}97.00%{opacity:1;transform:translateY(0)}100.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}.l3{opacity:0;animation:l3 12.8s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.l0{opacity:1}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)" opacity="0.7"/>
<rect width="1200" height="320" fill="url(#glow)"/>
